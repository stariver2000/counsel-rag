  - {q: "아이가 혼자 손목을 긋는 걸 봤어요",       target: boy, expect_slug: crisis-self-harm,     expect_crisis: true}
  - {q: "아들이 분노를 참지 못하고 소리를 질러요", target: boy, expect_slug: boy-anger-expression, expect_crisis: false}
