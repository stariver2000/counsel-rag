# 위기 신호 패턴 — 코드가 아닌 데이터 (설계문서 §8: 코드 배포 없이 갱신).
# M2에서 KYCI 매뉴얼 기반으로 대폭 보강한다. 아래는 최소 시드.
categories:
  self_harm:
    headline: 자해·자살 관련 신호가 감지되었습니다. 아래 전문기관에 즉시 연락하세요.
    hotlines:
      - "자살·정신건강 위기상담전화 109 (24시간)"
      - "청소년 전화 1388"
    guide_slug: crisis-selfharm-signs  # 실지식 slug. knowledge-sample 모드에선 대응 문서 없음(형식 예시 한계)
    patterns:
      - 죽고 싶
      - 죽어버리
      - 자살
      - 자해
      # ㅅ-불규칙(긋→그었/그어/그으) — 절단 어간("손목을 그")은 그네/그렇게와
      # 오탐하므로 활용형을 명시적으로 나열한다
      - 손목을 긋
      - 손목을 그었
      - 손목을 그어
      - 손목을 그으
      - 손목을 그은
  abuse:
    headline: 학대 관련 신호가 감지되었습니다. 아래 전문기관에 연락하세요.
    hotlines:
      - "아동학대 신고 112"
      - "청소년 전화 1388"
    guide_slug: crisis-self-harm  # 학대 전용 가이드 문서는 M2에서 추가 후 교체
    patterns:
      - 때려서 멍
      - 학대
      - 맞아서 다쳤
