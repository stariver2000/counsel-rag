# 개발·운영 공용 DB + kb-api 서버.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: counsel
      POSTGRES_PASSWORD: counsel
      POSTGRES_DB: counsel
    ports:
      - "5433:5432"   # 호스트의 다른 postgres와 충돌 방지를 위해 5433 사용
    volumes:
      - pgdata:/var/lib/postgresql/data

  kb-api:
    build: .
    depends_on: [db]
    environment:
      COUNSEL_DATABASE_URL: postgresql://counsel:counsel@db:5432/counsel
    ports:
      - "8100:8100"
    profiles: ["serve"]   # 개발 기본(compose up)에서는 db만 뜨게 분리
volumes:
  pgdata:
