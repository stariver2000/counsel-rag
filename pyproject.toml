[project]
name = "counsel-rag"
version = "0.1.0"
description = "대상별 상담지식 KB 서버 (검색 전용, LLM 없음)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "FlagEmbedding>=1.2",
    # transformers 5.x는 slow tokenizer의 prepare_for_model을 제거해
    # FlagEmbedding 리랭커(compute_score)가 깨진다 — 4.x로 고정
    "transformers<5",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: docker DB가 떠 있어야 하는 테스트",
    "slow: 실제 임베딩/리랭커 모델을 내려받아 도는 테스트",
]
# 기본 실행에서는 unit만 돈다. 통합/슬로우는 -m 으로 명시 실행
addopts = "-m 'not integration and not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counsel_rag"]
